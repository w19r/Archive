<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قيد التطوير | أرشيف</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* إعدادات عامة للصفحة */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #2c3e50;
        }

        /* صندوق المحتوى */
        .container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            max-width: 500px;
            width: 85%;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #1a252f;
        }

        p {
            font-size: 1.1rem;
            color: #555555;
            line-height: 1.6;
            margin-bottom: 20px;
        }


        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- مؤشر التحميل -->
        <div class="loader"></div>
        
        <!-- النصوص -->
        <h1>الموقع قيد التطوير</h1>
        <p>مرحباً بك في أرشيف <strong>عبد الله العايدي</strong>.</p>
        <p>نحن نعمل حالياً على تجهيز هذه الصفحة لتكون جاهزة قريباً. شكراً !</p>
    </div>

</body>
</html>
