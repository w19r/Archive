<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أرشيف عائلة عبد الله العايدي</title>
<meta name="description" content="أرشيف صور عائلة عبد الله العايدي، محفوظة ومرتبة عبر السنين.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF6F0;
    --card:#FFFFFF;
    --ink:#332C24;
    --sand:#A9825F;
    --sand-deep:#8A6741;
    --mist:#8C8175;
    --line:#E7DDCE;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    font-weight:400;
    line-height:1.8;
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit; text-decoration:none;}

  .display{font-family:'Aref Ruqaa', serif;}

  :focus-visible{
    outline:2px solid var(--sand-deep);
    outline-offset:3px;
    border-radius:2px;
  }

  .wrap{
    max-width:980px;
    margin:0 auto;
    padding:0 28px;
  }

  @media (max-width:600px){
    .wrap{padding:0 20px;}
  }

  /* ---------- header ---------- */

  header{
    padding:64px 0 40px;
    text-align:center;
    border-bottom:1px solid var(--line);
  }

  header h1{
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size:clamp(2rem, 5vw, 2.8rem);
    color:var(--sand-deep);
    margin-bottom:14px;
  }

  header p{
    color:var(--mist);
    font-size:1.02rem;
    max-width:38ch;
    margin:0 auto;
  }

  /* ---------- archive grid ---------- */

  main{padding:64px 0 88px;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));
    gap:28px;
  }

  .entry{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    transition:box-shadow 0.2s ease, transform 0.2s ease;
  }

  .entry:hover{
    box-shadow:0 10px 26px rgba(138,103,65,0.14);
    transform:translateY(-2px);
  }

  .entry-frame{
    aspect-ratio:4/5;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(155deg, #F1E6D6, #E7D7BE);
    overflow:hidden;
  }

  .entry-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .entry-frame span{
    font-family:'Aref Ruqaa', serif;
    font-size:2.6rem;
    color:var(--sand-deep);
    opacity:0.6;
  }

  .entry-info{
    padding:20px 22px 24px;
    text-align:center;
  }

  .entry-name{
    font-family:'Aref Ruqaa', serif;
    font-size:1.3rem;
    color:var(--ink);
    margin-bottom:6px;
  }

  .entry-desc{
    color:var(--mist);
    font-size:0.88rem;
  }

  /* ---------- contact section ---------- */

  .contact-section{
    padding:40px 0 72px;
  }

  .contact-box{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:40px 32px;
    max-width:560px;
    margin:0 auto;
    text-align:center;
  }

  .contact-box h2{
    font-family:'Aref Ruqaa', serif;
    font-size:1.8rem;
    color:var(--sand-deep);
    margin-bottom:8px;
  }

  .contact-box p{
    color:var(--mist);
    font-size:0.92rem;
    margin-bottom:28px;
  }

  .contact-form{
    display:flex;
    flex-direction:column;
    gap:14px;
    text-align:right;
  }

  .form-control{
    width:100%;
    padding:12px 16px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    font-size:0.95rem;
    transition:border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .form-control:focus{
    outline:none;
    border-color:var(--sand-deep);
    box-shadow:0 0 0 3px rgba(138,103,65,0.12);
  }

  textarea.form-control{
    resize:vertical;
    min-height:100px;
  }

  .btn-submit{
    background:var(--sand-deep);
    color:#FFFFFF;
    border:none;
    border-radius:8px;
    padding:13px;
    font-family:'IBM Plex Sans Arabic', sans-serif;
    font-size:1rem;
    font-weight:500;
    cursor:pointer;
    transition:background-color 0.2s ease, transform 0.2s ease;
    margin-top:6px;
  }

  .btn-submit:hover{
    background:var(--ink);
    transform:translateY(-1px);
  }

  /* ---------- footer ---------- */

  footer{
    padding:32px 0;
    text-align:center;
    border-top:1px solid var(--line);
  }

  footer span{
    color:var(--mist);
    font-size:0.82rem;
    direction:ltr;
    display:inline-block;
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>أرشيف عائلة عبد الله العايدي</h1>
    <p>مساحة لحفظ صور العائلة وذكرياتها عبر السنين.</p>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="grid">

      <a class="entry" href="/mohammed">
        <div class="entry-frame"><img src="assets/img/mohammed/IMG_7032_Original.jpeg" alt="محمد" width="800" height="1000" loading="lazy" decoding="async"></div>
        <div class="entry-info">
          <div class="entry-name">محمد</div>
          <div class="entry-desc">صور الشهيد محمد عبر السنين</div>
        </div>
      </a>

      <a class="entry" href="/abdulmajeed">
        <div class="entry-frame"><img src="assets/img/abdulmajeed/IMG_0782.jpeg" alt="عبد المجيد" width="800" height="1000" loading="lazy" decoding="async"></div>
        <div class="entry-info">
          <div class="entry-name">عبد المجيد</div>
          <div class="entry-desc">صور الشهيد عبد المجيد عبر السنين</div>
        </div>
      </a>

    </div>
  </div>
</main>

<section class="contact-section">
  <div class="wrap">
    <div class="contact-box">
      <h2>المساهمة في الأرشيف</h2>
      <p>إذا كانت لديك صور أو ذكريات تود إضافتها، يسعدنا تواصلك معنا.</p>

      <!-- تمت إضافة المعرف id للنموذج هنا -->
      <form id="my-contact-form" action="https://formspree.io/f/xaeywkdr" method="POST" class="contact-form">
        <input type="text" name="name" class="form-control" placeholder="الاسم" required>
        <input type="email" name="email" class="form-control" placeholder="البريد الإلكتروني" required>
        <textarea name="message" class="form-control" placeholder="اكتب رسالتك أو تفاصيل الصور..." required></textarea>
        <button type="submit" class="btn-submit">إرسال</button>
      </form>
      
      <!-- نص حالة الإرسال سيظهر هنا -->
      <p id="form-status" style="margin-top: 15px; font-weight: 500; text-align: center; font-family: 'IBM Plex Sans Arabic', sans-serif;"></p>
    </div>
  </div>
</section>

<footer>
  <span>© 2026 ABDALLAH ALAYDI. All Rights Reserved.</span>
</footer>

<!-- تمت إضافة السكربت الخاص بإرسال البيانات في الخلفية -->
<script>
  const form = document.getElementById("my-contact-form");
  const status = document.getElementById("form-status");

  form.addEventListener("submit", async function(event) {
    event.preventDefault(); // إيقاف إعادة التوجيه لصفحة Formspree
    
    // تغيير نص الزر أثناء الإرسال
    const btn = form.querySelector('.btn-submit');
    const originalBtnText = btn.innerText;
    btn.innerText = "جاري الإرسال...";
    
    const data = new FormData(event.target);
    
    try {
      const response = await fetch(event.target.action, {
        method: form.method,
        body: data,
        headers: { 'Accept': 'application/json' }
      });
      
      if (response.ok) {
        status.innerHTML = "شكرًا لك! تم إرسال رسالتك بنجاح.";
        status.style.color = "var(--sand-deep)";
        form.reset(); // تفريغ الحقول
      } else {
        status.innerHTML = "عذراً، حدث خطأ أثناء الإرسال. يرجى المحاولة لاحقاً.";
        status.style.color = "#d9534f"; // أحمر هادئ للخطأ
      }
    } catch (error) {
      status.innerHTML = "حدث خطأ في الاتصال، تأكد من جودة الإنترنت.";
      status.style.color = "#d9534f";
    }
    
    // إرجاع نص الزر كما كان
    btn.innerText = originalBtnText;
    
    // إخفاء رسالة النجاح بعد 5 ثوانٍ (اختياري)
    setTimeout(() => {
        status.innerHTML = "";
    }, 5000);
  });
</script>

</body>
</html>
