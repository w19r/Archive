<style>
  @font-face {
    font-family: 'Thamania Text';
    src: url('/assets/fonts/thmanyahseriftext-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'Thamania Sans';
    src: url('/assets/fonts/thmanyahseriftext-Medium.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  :root{
    --bg:#FAF6F0;
    --card:#FFFFFF;
    --ink:#332C24;
    --sand:#A9825F;
    --sand-deep:#8A6741;
    --mist:#8C8175;
    --line:#E7DDCE;
  }

  *{
    box-sizing:border-box;
    margin:0;
    padding:0;
  }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Thamania Text', serif;
    font-weight:400;
    line-height:1.8;
    -webkit-font-smoothing:antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  a{
    color:inherit;
    text-decoration:none;
  }

  h1, h2, h3 {
    font-family:'Thamania Sans', sans-serif;
    font-weight:700;
  }

  /* ---------- Header ---------- */
  header{
    padding:50px 0 20px;
    text-align:center;
  }

  header h1{
    font-size:clamp(1.5rem, 4vw, 2.2rem);
    color:var(--ink);
    transition: color 0.3s ease;
  }

  header h1:hover {
    color: var(--sand-deep);
  }

  /* ---------- 404 Minimal Content ---------- */
  main{
    flex: 1; 
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 20px 40px;
  }

  .error-content {
    text-align: center;
    max-width: 520px;
  }

  .error-code {
    font-family: 'Thamania Sans', sans-serif;
    font-size: 4rem;
    color: var(--mist);
    margin-bottom: 8px;
    letter-spacing: 2px;
  }

  .error-content h2 {
    font-size: 1.5rem;
    color: var(--ink);
    margin-bottom: 10px;
  }

  .error-content p {
    color: var(--mist);
    font-size: 0.98rem;
    margin-bottom: 30px;
  }

  /* مجموعة الأزرار */
  .error-actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
  }

  .btn-main-home {
    display: inline-block;
    background: var(--sand-deep);
    color: #FFFFFF;
    border: 1px solid var(--sand-deep);
    border-radius: 8px;
    padding: 11px 28px;
    font-family: 'Thamania Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    transition: all 0.25s ease;
    box-shadow: 0 4px 12px rgba(138, 103, 65, 0.1);
    width: 100%;
    max-width: 280px;
  }

  .btn-main-home:hover {
    background: var(--ink);
    border-color: var(--ink);
  }

  .martyrs-quick-links {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 280px;
    justify-content: center;
  }

  .btn-sub-link {
    flex: 1;
    background: var(--card);
    color: var(--sand-deep);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 12px;
    font-family: 'Thamania Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    transition: all 0.25s ease;
    box-shadow: 0 2px 8px rgba(138, 103, 65, 0.04);
  }

  .btn-sub-link:hover {
    border-color: var(--sand-deep);
    background: #FDFBF8;
    transform: translateY(-1px);
  }

  /* ---------- Footer ---------- */
  footer{
    padding:32px 0;
    text-align:center;
    border-top:1px solid var(--line);
  }

  footer span{
    color:var(--mist);
    font-size:0.82rem;
    direction:ltr;
    display:inline-block;
  }

  footer span a {
    color: var(--sand-deep);
    font-weight: 700;
    transition: color 0.2s ease;
  }

  footer span a:hover {
    color: var(--ink);
    text-decoration: underline;
  }

</style>
</head>

<body>

  <header>
    <a href="/"><h1>أرشيف عائلة عبد الله العايدي</h1></a>
  </header>

  <main>
    <div class="error-content">
      <div class="error-code">404</div>
      <h2>عذراً، هذا السجل غير موجود</h2>
      <p>ربما تم نقل الصفحة أو أن الرابط الذي اتبعته غير صحيح. يمكنك التوجه مباشرة إلى الرئيسية أو اختيار أحد أرشيفات الشهداء أدناه:</p>
      
      <div class="error-actions">
        <a href="/" class="btn-main-home">العودة للرئيسية</a>
        <div class="martyrs-quick-links">
          <a href="/mohammed" class="btn-sub-link">أرشيف محمد</a>
          <a href="/abdulmajeed" class="btn-sub-link">أرشيف عبد المجيد</a>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <span dir="ltr">© 2026 <a href="https://abdallahalaydi.com" target="_blank">ABDALLAH ALAYDI</a>. All Rights Reserved.</span>
  </footer>

</body>
</html>
