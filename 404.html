<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>الصفحة غير موجودة - أرشيف عائلة عبد الله العايدي</title>
  <meta name="description" content="عذراً، الصفحة التي تبحث عنها غير موجودة في أرشيف عائلة العايدي.">
  <meta name="theme-color" content="#FAF6F0">

  <!-- ==========================================

       ========================================== -->
  <link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
  <link rel="manifest" href="/assets/favicon/site.webmanifest">

<style>

  @font-face {
    font-family: 'Thamania Text';
    src: url('/assets/fonts/thmanyahseriftext-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }


  @font-face {
    font-family: 'Thamania Sans';
    src: url('/assets/fonts/thmanyahseriftext-Medium.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  :root{
    --bg:#FAF6F0;
    --card:#FFFFFF;
    --ink:#332C24;
    --sand:#A9825F;
    --sand-deep:#8A6741;
    --mist:#8C8175;
    --line:#E7DDCE;
  }

  *{
    box-sizing:border-box;
    margin:0;
    padding:0;
  }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Thamania Text', serif;
    font-weight:400;
    line-height:1.8;
    -webkit-font-smoothing:antialiased;

    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  a{
    color:inherit;
    text-decoration:none;
  }

  h1, h2, h3, h4, h5, h6 {
    font-family:'Thamania Sans', sans-serif;
    font-weight:700;
  }

  .wrap{
    max-width:980px;
    margin:0 auto;
    padding:0 28px;
  }

  /* ---------- Header ---------- */
  header{
    padding:40px 0 20px;
    text-align:center;
  }

  header h1{
    font-size:clamp(1.5rem, 4vw, 2.2rem);
    color:var(--ink);
    transition: color 0.3s ease;
  }

  header h1:hover {
    color: var(--sand-deep);
  }

  /* ---------- 404 Main Content ---------- */
  main{
    flex: 1; /* لتعبئة المساحة المتبقية ودفع الفوتر للأسفل */
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 0 60px;
  }

  .error-container {
    text-align: center;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 60px 40px;
    max-width: 600px;
    width: 100%;
    box-shadow: 0 15px 35px rgba(138,103,65,0.08);
  }

  .error-code {
    font-family: 'Thamania Sans', sans-serif;
    font-size: clamp(5rem, 15vw, 7rem);
    line-height: 1;
    color: var(--sand-deep);
    margin-bottom: 20px;
  }

  .error-container h2 {
    font-size: 1.8rem;
    color: var(--ink);
    margin-bottom: 12px;
  }

  .error-container p {
    color: var(--mist);
    font-size: 1.05rem;
    margin-bottom: 36px;
    max-width: 40ch;
    margin-left: auto;
    margin-right: auto;
  }


  .btn-home {
    display: inline-block;
    background: var(--sand-deep);
    color: #FFFFFF;
    border: none;
    border-radius: 8px;
    padding: 13px 32px;
    font-family: 'Thamania Sans', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
  }

  .btn-home:hover {
    background: var(--ink);
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(51,44,36,0.15);
  }

  /* ---------- Footer ---------- */
  footer{
    padding:32px 0;
    text-align:center;
    border-top:1px solid var(--line);
    background: var(--bg);
  }

  footer span{
    color:var(--mist);
    font-size:0.82rem;
    direction:ltr;
    display:inline-block;
  }

</style>
</head>

<body>

  <header>
    <div class="wrap">

      <a href="/"><h1>أرشيف عائلة عبد الله العايدي</h1></a>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div class="error-container">
        <div class="error-code">404</div>
        <h2>عذراً، لم نتمكن من العثور على السجل</h2>
        <p>يبدو أن الصفحة التي تحاول الوصول إليها قد تم نقلها أو أنها غير موجودة في الأرشيف.</p>
        
        <a href="/" class="btn-home">العودة إلى الصفحة الرئيسية</a>
      </div>
    </div>
  </main>

  <footer>
    <span>2026 ABDALLAH ALAYDI. All Rights Reserved.©</span>
  </footer>

</body>
</html>
