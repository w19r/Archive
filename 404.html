<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>الصفحة غير موجودة - أرشيف عائلة عبد الله العايدي</title>
  <meta name="description" content="عذراً، الصفحة التي تبحث عنها غير موجودة في أرشيف عائلة العايدي.">
  <meta name="theme-color" content="#FAF6F0">

  <!-- أيقونات الموقع -->
  <link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
  <link rel="manifest" href="/assets/favicon/site.webmanifest">

<style>
  @font-face {
    font-family: 'Thamania Text';
    src: url('/assets/fonts/thmanyahseriftext-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'Thamania Sans';
    src: url('/assets/fonts/thmanyahseriftext-Medium.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  :root{
    --bg:#FAF6F0;
    --ink:#332C24;
    --sand-deep:#8A6741;
    --mist:#8C8175;
    --line:#E7DDCE;
  }

  *{
    box-sizing:border-box;
    margin:0;
    padding:0;
  }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Thamania Text', serif;
    font-weight:400;
    line-height:1.8;
    -webkit-font-smoothing:antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  a{
    color:inherit;
    text-decoration:none;
  }

  h1, h2, h3 {
    font-family:'Thamania Sans', sans-serif;
    font-weight:700;
  }

  /* ---------- Header ---------- */
  header{
    padding:64px 0 20px;
    text-align:center;
  }

  header h1{
    font-size:clamp(1.5rem, 4vw, 2.2rem);
    color:var(--ink);
    transition: color 0.3s ease;
  }

  header h1:hover {
    color: var(--sand-deep);
  }

  /* ---------- 404 Minimal Content ---------- */
  main{
    flex: 1; 
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 20px;
  }

  .error-content {
    text-align: center;
    max-width: 500px;
  }

  /* رقم 404 بلون هادئ جداً (لون الضباب) وحجم متوسط */
  .error-code {
    font-family: 'Thamania Sans', sans-serif;
    font-size: 4rem;
    color: var(--mist);
    margin-bottom: 10px;
    letter-spacing: 2px;
  }

  .error-content h2 {
    font-size: 1.5rem;
    color: var(--ink);
    margin-bottom: 12px;
  }

  .error-content p {
    color: var(--mist);
    font-size: 1rem;
    margin-bottom: 40px;
  }

  /* زر العودة: شفاف وأنيق (Ghost Button) */
  .btn-home {
    display: inline-block;
    background: transparent;
    color: var(--sand-deep);
    border: 1px solid var(--sand-deep);
    border-radius: 6px;
    padding: 10px 28px;
    font-family: 'Thamania Sans', sans-serif;
    font-size: 1rem;
    transition: all 0.3s ease;
  }

  .btn-home:hover {
    background: var(--sand-deep);
    color: #FFFFFF;
  }

  /* ---------- Footer ---------- */
  footer{
    padding:32px 0;
    text-align:center;
    border-top:1px solid var(--line);
  }

  footer span{
    color:var(--mist);
    font-size:0.82rem;
    direction:ltr;
    display:inline-block;
  }

</style>
</head>

<body>

  <header>
    <a href="/"><h1>أرشيف عائلة عبد الله العايدي</h1></a>
  </header>

  <main>
    <div class="error-content">
      <div class="error-code">404</div>
      <h2>عذراً، هذا السجل غير موجود</h2>
      <p>ربما تم نقل الصفحة أو أن الرابط الذي اتبعته غير صحيح.</p>
      
      <a href="/" class="btn-home">العودة للرئيسية</a>
    </div>
  </main>

  <footer>
    <span>2026 ABDALLAH ALAYDI. All Rights Reserved.©</span>
  </footer>

</body>
</html>
