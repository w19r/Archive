<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم - أرشيف العائلة</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#FAF6F0; --card:#FFFFFF; --ink:#332C24; --sand-deep:#8A6741; --mist:#8C8175; --line:#E7DDCE; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans Arabic', sans-serif; padding:40px 20px; }
  .wrap{max-width:700px; margin:0 auto;}
  
  .card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:32px; box-shadow:0 4px 20px rgba(138,103,65,0.05); margin-bottom: 24px;}
  h1{font-size:1.6rem; color:var(--sand-deep); margin-bottom:8px; text-align:center;}
  p{color:var(--mist); font-size:0.9rem; margin-bottom:24px; text-align:center;}
  
  .form-group{margin-bottom:16px;}
  label{display:block; margin-bottom:6px; font-weight:500; font-size:0.9rem;}
  input, select, textarea{ width:100%; padding:12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); font-family:inherit; font-size:0.95rem; }
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--sand-deep);}
  
  .custom-input { display: none; margin-top: 10px; }
  
  .btn{ width:100%; background:var(--sand-deep); color:#fff; border:none; padding:14px; border-radius:8px; font-size:1rem; font-weight:500; cursor:pointer; transition: background 0.2s; margin-top: 10px;}
  .btn:hover{background:var(--ink);}
  
  .btn-outline{background: transparent; color: var(--sand-deep); border: 2px solid var(--sand-deep);}
  .btn-outline:hover{background: var(--sand-deep); color: white;}
  #status, #delete-status{margin-top:15px; text-align:center; font-weight:500;}
  
  .post-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--line); }
  .post-item:last-child { border-bottom: none; }
  .post-info { display: flex; flex-direction: column; gap: 6px; }
  .post-title { font-weight: 600; color: var(--ink); }
  
  .post-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .post-year { font-size: 0.85rem; color: var(--mist); }
  .post-badge { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
  .badge-gray { background: #f0f0f0; color: #777; }
  .badge-blue { background: #e8f4f8; color: #0275d8; }
  
  .btn-delete { background: #d9534f; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 0.85rem;}
  .btn-delete:hover { background: #c9302c; }
</style>
</head>
<body>

<div class="wrap">
  <!-- المربع الأول: قسم إضافة المنشور ورفع الصورة -->
  <div class="card">
    <h1>لوحة التحكم الذكية</h1>
    <p>رفع الصور التلقائي إلى GitHub و JSONBin</p>

    <form id="admin-form">
      <div class="form-group">
        <label>الأرشيف المستهدف</label>
        <select id="target-archive">
          <option value="mohammed">أرشيف محمد</option>
          <option value="abdulmajeed">أرشيف عبد المجيد</option>
        </select>
      </div>

      <div class="form-group">
        <label>السنة / المرحلة</label>
        <select id="year-select" onchange="toggleCustomInput('year-select', 'custom-year')"></select>
        <input type="text" id="custom-year" class="custom-input" placeholder="اكتب السنة أو المرحلة هنا...">
      </div>
      
      <!-- اختيار الصورة من الجهاز مباشرة -->
      <div class="form-group">
        <label>اختر الصورة من جهازك</label>
        <input type="file" id="image-file" accept="image/*" required style="padding: 9px;">
      </div>

      <div class="form-group">
        <label>عنوان المنشور</label>
        <select id="title-select" onchange="toggleCustomInput('title-select', 'custom-title')">
          <option value="لحظات عفوية">لحظات عفوية</option>
          <option value="مرحلة الطفولة">مرحلة الطفولة</option>
          <option value="مرحلة الشباب">مرحلة الشباب</option>
          <option value="ذكريات العائلة">ذكريات العائلة</option>
          <option value="custom">كتابة عنوان مخصص...</option>
        </select>
        <input type="text" id="custom-title" class="custom-input" placeholder="اكتب العنوان هنا...">
      </div>

      <div class="form-group">
        <label>الوصف</label>
        <select id="desc-select" onchange="toggleCustomInput('desc-select', 'custom-desc')">
          <option value="صورة تذكارية">صورة تذكارية.</option>
          <option value="صورة تذكارية للذكرى.">صورة تذكارية للذكرى.</option>
          <option value="لقطة عفوية تفيض بالحب، توثق لحظات لا تُنسى.">لقطة عفوية تفيض بالحب، توثق لحظات لا تُنسى.</option>
          <option value="custom">كتابة وصف مخصص...</option>
        </select>
        <textarea id="custom-desc" class="custom-input" rows="2" placeholder="اكتب الوصف هنا..."></textarea>
      </div>

      <!-- إعدادات الأمان (تخزن محلياً فقط ولا تُكتب في الكود) -->
      <div class="form-group" style="border-top: 1px solid var(--line); padding-top: 15px; margin-top: 15px;">
        <label style="color: var(--sand-deep);">مفاتيح الأمان (تُحفظ في متصفحك تلقائياً)</label>
      </div>
      <div class="form-group">
        <label>مفتاح JSONBin Master Key</label>
        <input type="password" id="master-key" placeholder="أدخل مفتاح JSONBin" required>
      </div>
      <div class="form-group">
        <label>مفتاح GitHub Personal Access Token</label>
        <input type="password" id="github-token" placeholder="أدخل مفتاح GitHub Token الخاص بك" required>
      </div>

      <button type="submit" class="btn" id="submit-btn">رفع الصورة ونشر المنشور</button>
    </form>
    <p id="status"></p>
  </div>

  <!-- المربع الثاني: قسم إدارة وحذف المنشورات -->
  <div class="card">
    <h2 style="font-size: 1.3rem; color: var(--sand-deep); margin-bottom: 15px; text-align: center;">إدارة المنشورات الحالية</h2>
    <p style="margin-bottom: 15px; font-size: 0.85rem;">اختر الأرشيف وضع المفاتيح في الأعلى، ثم اضغط هنا:</p>
    <button type="button" class="btn btn-outline" id="load-posts-btn">عرض المنشورات للتعديل/الحذف</button>
    <p id="delete-status"></p>
    <div id="posts-list" style="margin-top: 15px;"></div>
  </div>
</div>

<script>
  const GITHUB_REPO_OWNER = "w19r";
  const GITHUB_REPO_NAME = "archive";

  const yearSelect = document.getElementById("year-select");
  let yearsHTML = "";
  for (let y = 2025; y >= 1960; y--) {
    yearsHTML += `<option value="${y}">${y}</option>`;
  }
  yearsHTML += `<option value="custom">كتابة سنة/مرحلة مخصصة...</option>`;
  yearSelect.innerHTML = yearsHTML;

  function toggleCustomInput(selectId, inputId) {
    const select = document.getElementById(selectId);
    const input = document.getElementById(inputId);
    if (select.value === 'custom') {
      input.style.display = 'block';
      input.required = true;
    } else {
      input.style.display = 'none';
      input.required = false;
    }
  }

  const BINS = {
    "mohammed": "6a90878ef5f4af5e294ae1b6",
    "abdulmajeed": "6a908f46da38895dfe196b09"
  };

  const masterKeyInput = document.getElementById("master-key");
  const githubTokenInput = document.getElementById("github-token");

  // استرجاع المفاتيح المخزنة محلياً في المتصفح تلقائياً
  if(localStorage.getItem("my_secret_key")) masterKeyInput.value = localStorage.getItem("my_secret_key");
  if(localStorage.getItem("github_token")) githubTokenInput.value = localStorage.getItem("github_token");

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = error => reject(error);
    });
  }

  // 1. إضافة منشور ورفع الصورة لـ GitHub تلقائياً
  document.getElementById("admin-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("submit-btn");
    const status = document.getElementById("status");
    btn.innerText = "جاري رفع الصورة إلى GitHub...";
    status.innerHTML = "";

    const selectedArchive = document.getElementById("target-archive").value;
    const binId = BINS[selectedArchive];
    const masterKey = masterKeyInput.value;
    const githubToken = githubTokenInput.value;

    // حفظ المفاتيح في المتصفح محلياً لعدم إدخالها مرة أخرى
    localStorage.setItem("my_secret_key", masterKey);
    localStorage.setItem("github_token", githubToken);

    const fileInput = document.getElementById("image-file");
    const file = fileInput.files[0];
    if (!file) {
      status.innerHTML = "الرجاء اختيار صورة.";
      status.style.color = "red";
      btn.innerText = "رفع الصورة ونشر المنشور";
      return;
    }

    try {
      const base64Content = await fileToBase64(file);
      const fileName = Date.now() + "_" + file.name.replace(/\s+/g, '_');
      const filePath = `assets/img/${selectedArchive}/${fileName}`;

      const githubRes = await fetch(`https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/contents/${filePath}`, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${githubToken}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: `Upload new archive image: ${fileName}`,
          content: base64Content
        })
      });

      if (!githubRes.ok) {
        const errData = await githubRes.json();
        throw new Error("فشل رفع الصورة لـ GitHub: " + (errData.message || "تأكد من صلاحيات Token"));
      }

      btn.innerText = "جاري تحديث السحابة...";

      let finalYear = document.getElementById("year-select").value;
      if (finalYear === 'custom') finalYear = document.getElementById("custom-year").value;

      let finalTitle = document.getElementById("title-select").value;
      if (finalTitle === 'custom') finalTitle = document.getElementById("custom-title").value;

      let finalDesc = document.getElementById("desc-select").value;
      if (finalDesc === 'custom') finalDesc = document.getElementById("custom-desc").value;

      const newItem = {
        id: Date.now().toString(),
        year: finalYear,
        image: `../assets/img/${selectedArchive}/${fileName}`,
        title: finalTitle,
        desc: finalDesc
      };

      const getRes = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, { headers: { 'X-Master-Key': masterKey } });
      if (!getRes.ok) throw new Error("مفتاح JSONBin غير صحيح!");
      
      const getData = await getRes.json();
      const currentGallery = getData.record.gallery || [];
      currentGallery.push(newItem);

      const updateRes = بهذه طريقة fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Master-Key': masterKey },
        body: JSON.stringify({ gallery: currentGallery })
      });

      if (updateRes.ok) {
        status.innerHTML = "تم رفع الصورة ونشر المنشور بنجاح! 🎉";
        status.style.color = "var(--sand-deep)";
        
        document.getElementById("image-file").value = "";
        document.getElementById("custom-year").value = "";
        document.getElementById("custom-title").value = "";
        document.getElementById("custom-desc").value = "";
      }
    } catch (err) {
      status.innerHTML = err.message;
      status.style.color = "red";
    }
    btn.innerText = "رفع الصورة ونشر المنشور";
  });

  // 2. جلب المنشورات للحذف
  document.getElementById("load-posts-btn").addEventListener("click", async () => {
    const listDiv = document.getElementById("posts-list");
    const delStatus = document.getElementById("delete-status");
    const selectedArchive = document.getElementById("target-archive").value;
    const binId = BINS[selectedArchive];
    const masterKey = masterKeyInput.value;
    
    if(!masterKey) {
      delStatus.innerHTML = "الرجاء إدخال مفتاح JSONBin أولاً.";
      delStatus.style.color = "red";
      return;
    }

    listDiv.innerHTML = "<p style='text-align:center;'>جاري التحميل...</p>";
    delStatus.innerHTML = "";

    try {
      const getRes = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, { headers: { 'X-Master-Key': masterKey } });
      if (!getRes.ok) throw new Error("فشل الجلب، تأكد من مفتاح JSONBin.");
      
      const getData = await getRes.json();
      const gallery = getData.record.gallery || [];
      
      if(gallery.length === 0){
        listDiv.innerHTML = "<p style='text-align:center;'>لا توجد منشورات حالياً.</p>";
        return;
      }

      listDiv.innerHTML = "";
      gallery.forEach(item => {
        const div = document.createElement("div");
        div.className = "post-item";
        
        const displayId = item.id ? item.id : 'بدون ID';
        const imageName = item.image ? item.image.split('/').pop() : 'بدون صورة';
        
        div.innerHTML = `
          <div class="post-info">
            <span class="post-title">${item.title || 'بدون عنوان'}</span>
            <div class="post-meta">
              <span class="post-year">السنة: ${item.year}</span>
              <span class="post-badge badge-gray">ID: ${displayId}</span>
              <span class="post-badge badge-blue">ملف: ${imageName}</span>
            </div>
          </div>
          <button class="btn-delete" onclick="deletePost('${item.id || ''}', '${item.title}')">حذف</button>
        `;
        listDiv.appendChild(div);
      });
    } catch (err) {
      listDiv.innerHTML = "";
      delStatus.innerHTML = err.message;
      delStatus.style.color = "red";
    }
  });

  // 3. الحذف
  window.deletePost = async (id, title) => {
    if(!id) {
      alert("عذراً، هذا المنشور القديم لا يمتلك ID.");
      return;
    }
    if(!confirm(`هل أنت متأكد أنك تريد حذف منشور "${title}"؟`)) return;

    const delStatus = document.getElementById("delete-status");
    const selectedArchive = document.getElementById("target-archive").value;
    const binId = BINS[selectedArchive];
    const masterKey = masterKeyInput.value;

    delStatus.innerHTML = "جاري الحذف...";
    delStatus.style.color = "var(--ink)";

    try {
      const getRes = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, { headers: { 'X-Master-Key': masterKey } });
      const getData = await getRes.json();
      let currentGallery = getData.record.gallery || [];

      currentGallery = currentGallery.filter(item => item.id !== id);

      const updateRes = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Master-Key': masterKey },
        body: JSON.stringify({ gallery: currentGallery })
      });

      if (updateRes.ok) {
        delStatus.innerHTML = "تم الحذف بنجاح!";
        delStatus.style.color = "green";
        document.getElementById("load-posts-btn").click();
      }
    } catch (err) {
      delStatus.innerHTML = "حدث خطأ أثناء الحذف.";
      delStatus.style.color = "red";
    }
  };
</script>

</body>
</html>
