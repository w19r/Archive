<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم - أرشيف العائلة</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#FAF6F0; --card:#FFFFFF; --ink:#332C24; --sand-deep:#8A6741; --mist:#8C8175; --line:#E7DDCE; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans Arabic', sans-serif; padding:40px 20px; }
  .wrap{max-width:600px; margin:0 auto;}
  .card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:32px; box-shadow:0 4px 20px rgba(138,103,65,0.05); }
  h1{font-size:1.6rem; color:var(--sand-deep); margin-bottom:8px; text-align:center;}
  p{color:var(--mist); font-size:0.9rem; margin-bottom:24px; text-align:center;}
  .form-group{margin-bottom:16px;}
  label{display:block; margin-bottom:6px; font-weight:500; font-size:0.9rem;}
  input, select, textarea{ width:100%; padding:12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); font-family:inherit; font-size:0.95rem; }
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--sand-deep);}
  .btn{ width:100%; background:var(--sand-deep); color:#fff; border:none; padding:14px; border-radius:8px; font-size:1rem; font-weight:500; cursor:pointer; transition: background 0.2s; margin-top: 10px;}
  .btn:hover{background:var(--ink);}
  #status{margin-top:15px; text-align:center; font-weight:500;}
</style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <h1>لوحة التحكم الآمنة</h1>
    <p>أضف منشوراً جديداً بكل سهولة وأمان</p>

    <form id="admin-form">
      <div class="form-group">
        <label>الأرشيف المستهدف</label>
        <select id="target-archive">
          <option value="mohammed">أرشيف محمد</option>
          <option value="abdulmajeed">أرشيف عبد المجيد</option>
        </select>
      </div>

      <div class="form-group">
        <label>السنة / المرحلة</label>
        <input type="text" id="item-year" placeholder="مثال: 1995" required>
      </div>

      <div class="form-group">
        <label>اسم الصورة (مع الامتداد)</label>
        <input type="text" id="item-image" placeholder="مثال: photo2.jpg" required>
      </div>

      <div class="form-group">
        <label>عنوان المنشور</label>
        <input type="text" id="item-title" placeholder="مثال: مرحلة الشباب" required>
      </div>

      <div class="form-group">
        <label>الوصف</label>
        <textarea id="item-desc" rows="3" placeholder="تفاصيل الصورة أو الذكريات..." required></textarea>
      </div>

      <!-- خانة كلمة المرور (لن تحفظ في الكود) -->
      <div class="form-group" style="border-top: 1px solid var(--line); padding-top: 15px; margin-top: 15px;">
        <label style="color: #d9534f;">مفتاح الأمان (Master Key)</label>
        <input type="password" id="master-key" placeholder="أدخل المفتاح السري الخاص بـ JSONBin" required>
      </div>

      <button type="submit" class="btn" id="submit-btn">حفظ ونشر المنشور</button>
    </form>
    <p id="status"></p>
  </div>
</div>

<script>
  // ضع هنا أرقام الـ Bin ID فقط (وهي ليست سرية، السر في الـ Master Key)
  const BINS = {
    "mohammed": "6a90878ef5f4af5e294ae1b6",
    "abdulmajeed": "6a907d2ef5f4af5e294ab941" // هذا الذي أنشأته أنت
  };

  const form = document.getElementById("admin-form");
  const status = document.getElementById("status");
  const masterKeyInput = document.getElementById("master-key");

  // لجعل حياتك أسهل: المتصفح سيتذكر المفتاح في جهازك فقط ولن يطلبه كل مرة
  if(localStorage.getItem("my_secret_key")) {
    masterKeyInput.value = localStorage.getItem("my_secret_key");
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("submit-btn");
    btn.innerText = "جاري الحفظ والسحب...";
    status.innerHTML = "";

    const selectedArchive = document.getElementById("target-archive").value;
    const binId = BINS[selectedArchive];
    const masterKey = masterKeyInput.value;
    const imageName = document.getElementById("item-image").value;

    // حفظ المفتاح في متصفحك محلياً لعدم كتابته مرة أخرى
    localStorage.setItem("my_secret_key", masterKey);

    const newItem = {
      year: document.getElementById("item-year").value,
      image: `../assets/img/${selectedArchive}/${imageName}`, // دمج المسار تلقائياً
      title: document.getElementById("item-title").value,
      desc: document.getElementById("item-desc").value
    };

    try {
      // 1. جلب البيانات
      const getRes = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
        headers: { 'X-Master-Key': masterKey }
      });
      
      if (!getRes.ok) throw new Error("المفتاح السري غير صحيح!");
      
      const getData = await getRes.json();
      const currentGallery = getData.record.gallery || [];

      // 2. إضافة وتحديث
      currentGallery.push(newItem);

      const updateRes = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': masterKey
        },
        body: JSON.stringify({ gallery: currentGallery })
      });

      if (updateRes.ok) {
        status.innerHTML = "تم نشر المنشور بنجاح! 🎉";
        status.style.color = "var(--sand-deep)";
        document.getElementById("item-year").value = "";
        document.getElementById("item-image").value = "";
        document.getElementById("item-title").value = "";
        document.getElementById("item-desc").value = "";
      }
    } catch (err) {
      status.innerHTML = err.message || "حدث خطأ في الاتصال.";
      status.style.color = "red";
    }
    btn.innerText = "حفظ ونشر المنشور";
  });
</script>

</body>
</html>
