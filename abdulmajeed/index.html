<script>
  const ARABIC_MONTHS = [
    "يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو",
    "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"
  ];

  /**
   * محلل التواريخ الذكي: يدعم:
   * 1) تاريخ كامل: 2014-06-19
   * 2) شهر وسنة: 2014-06
   * 3) فترة تقريبية (نطاق سنوات): 2010-2012
   * 4) سنة فقط أو سنة تقريبية: 2014 أو ~2014
   */
  function analyzeDateInput(rawInput) {
    if (!rawInput) return null;
    const str = String(rawInput).trim();

    // الحالة 1: نطاق سنوات تقريبي مثل "2010-2012" أو "2010 - 2012"
    const rangeMatch = str.match(/^(\d{4})\s*[-–/]\s*(\d{4})$/);
    if (rangeMatch) {
      const y1 = parseInt(rangeMatch[1], 10);
      const y2 = parseInt(rangeMatch[2], 10);
      const minY = Math.min(y1, y2);
      const maxY = Math.max(y1, y2);
      const midYear = Math.round((minY + maxY) / 2);
      const midDate = new Date(midYear, 5, 15); // منتصف الفترة للترتيب العادل

      return {
        type: "range",
        isApprox: true,
        minYear: minY,
        maxYear: maxY,
        sortTime: midDate.getTime(),
        badgeText: minY === maxY ? `${minY}` : `بين ${minY} – ${maxY}`,
        refDate: midDate
      };
    }

    // الحالة 2: تاريخ كامل باليوم والشهر والسنة YYYY-MM-DD (مثل 2014-06-19)
    const fullMatch = str.match(/^(\d{4})\s*[-/]\s*(\d{1,2})\s*[-/]\s*(\d{1,2})$/);
    if (fullMatch) {
      const y = parseInt(fullMatch[1], 10);
      const m = parseInt(fullMatch[2], 10) - 1;
      const d = parseInt(fullMatch[3], 10);
      if (m >= 0 && m < 12 && d >= 1 && d <= 31) {
        const dateObj = new Date(y, m, d);
        return {
          type: "full",
          isApprox: false,
          minYear: y,
          maxYear: y,
          sortTime: dateObj.getTime(),
          badgeText: `${d} ${ARABIC_MONTHS[m]} ${y}`,
          refDate: dateObj
        };
      }
    }

    // الحالة 3: سنة وشهر فقط YYYY-MM (بشرط أن يكون الشهر من 1 إلى 12)
    const monthMatch = str.match(/^(\d{4})\s*[-/]\s*(\d{1,2})$/);
    if (monthMatch) {
      const y = parseInt(monthMatch[1], 10);
      const m = parseInt(monthMatch[2], 10) - 1;
      if (m >= 0 && m < 12) {
        const dateObj = new Date(y, m, 1);
        return {
          type: "month",
          isApprox: false,
          minYear: y,
          maxYear: y,
          sortTime: dateObj.getTime(),
          badgeText: `${ARABIC_MONTHS[m]} ${y}`,
          refDate: dateObj
        };
      }
    }

    // الحالة 4: سنة منفردة مثل "2014" أو "~2014"
    const yearMatch = str.match(/(\d{4})/);
    if (yearMatch) {
      const y = parseInt(yearMatch[1], 10);
      const isApprox = str.includes("~") || str.includes("تقريب") || str.includes("حوالي");
      // نضعها في 1 يناير من تلك السنة لكي تظهر صور الأشهر المحددة في نفس السنة أولاً ثم صور السنة العامة
      const dateObj = new Date(y, 0, 1);
      return {
        type: "year",
        isApprox: isApprox,
        minYear: y,
        maxYear: y,
        sortTime: dateObj.getTime(),
        badgeText: isApprox ? `قرابة ${y}` : `عام ${y}`,
        refDate: dateObj
      };
    }

    return null;
  }

  // حساب المدة المنقضية مع تمييز التواريخ التقريبية بكلمة "قرابة"
  function calculateElapsedText(dateInfo) {
    if (!dateInfo || !dateInfo.refDate) return "";

    const now = new Date();
    const dateObj = dateInfo.refDate;
    const prefix = dateInfo.isApprox ? "منذ قرابة " : "منذ ";

    let years = now.getFullYear() - dateObj.getFullYear();
    let months = now.getMonth() - dateObj.getMonth();

    if (now.getDate() < dateObj.getDate()) {
      months--;
    }
    if (months < 0) {
      years--;
      months += 12;
    }

    if (years < 0) return "";
    if (years === 0 && months === 0) return "هذا الشهر";
    if (years === 0) {
      if (months === 1) return `${prefix}شهر`;
      if (months === 2) return `${prefix}شهرين`;
      if (months <= 10) return `${prefix}${months} أشهر`;
      return `${prefix}${months} شهراً`;
    }
    if (years === 1) return `${prefix}عام`;
    if (years === 2) return `${prefix}عامين`;
    if (years >= 3 && years <= 10) return `${prefix}${years} أعوام`;
    return `${prefix}${years} عاماً`;
  }

  function showToast() {
    const toast = document.getElementById("toast");
    toast.classList.add("show");
    setTimeout(() => {
      toast.classList.remove("show");
    }, 2500);
  }

  // تحديث شريط التقدم العلوي عند التمرير
  window.addEventListener("scroll", () => {
    const scrollTop = window.scrollY;
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
    const bar = document.getElementById("progress-bar");
    if (bar) bar.style.width = `${progress}%`;
  });

  document.addEventListener("DOMContentLoaded", async () => {
    // ملاحظة: غيّر هذا التاريخ إلى "2014-07-25" في صفحة عبد المجيد، أو "2025-08-26" في صفحة محمد
    const MARTYRDOM_DATE = "2025-08-26";
    // ملاحظة: ضع الـ BIN_ID الخاص بالصفحة هنا
    const BIN_ID = "6a90878ef5f4af5e294ae1b6";

    const martyrdomInfo = analyzeDateInput(MARTYRDOM_DATE);
    const martyrdomElapsed = calculateElapsedText(martyrdomInfo);
    const elapsedEl = document.getElementById("martyrdom-elapsed");
    if (martyrdomElapsed && elapsedEl) {
      elapsedEl.textContent = `• (${martyrdomElapsed})`;
    }

    const container = document.getElementById("gallery-container");
    if (!container) return;

    const urlParams = new URLSearchParams(window.location.search);
    const targetId = urlParams.get("id");

    let galleryData = [];
    let sortNewestFirst = true;

    // عناصر نافذة تكبير الصور (Lightbox)
    const lightbox = document.getElementById("lightbox");
    const lbImg = document.getElementById("lightbox-img");
    const lbTitle = document.getElementById("lightbox-title");
    const lbDate = document.getElementById("lightbox-date");
    const lbDesc = document.getElementById("lightbox-desc");
    const lbClose = document.getElementById("lightbox-close");

    function openLightbox(imgSrc, title, badgeText, elapsed, desc) {
      if (!lightbox) return;
      lbImg.src = imgSrc;
      lbImg.alt = title;
      lbTitle.textContent = title;
      lbDate.textContent = elapsed ? `${badgeText} (${elapsed})` : badgeText;
      lbDesc.textContent = desc;
      lightbox.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      if (!lightbox) return;
      lightbox.classList.remove("open");
      document.body.style.overflow = "";
    }

    if (lbClose && lightbox) {
      lbClose.addEventListener("click", closeLightbox);
      lightbox.addEventListener("click", (e) => {
        if (e.target === lightbox) closeLightbox();
      });
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add("visible");
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });

    function renderGallery() {
      // ترتيب العناصر بدقة باستخدام sortTime المحسوب لكل حالة
      galleryData.sort((a, b) => {
        const timeA = a._dateInfo ? a._dateInfo.sortTime : 0;
        const timeB = b._dateInfo ? b._dateInfo.sortTime : 0;
        return sortNewestFirst ? (timeB - timeA) : (timeA - timeB);
      });

      container.innerHTML = "";

      galleryData.forEach(item => {
        const itemId = item.id || item.title.replace(/\s+/g, '-');
        const info = item._dateInfo;
        const badgeText = info ? info.badgeText : item.year;
        const elapsedText = calculateElapsedText(info);

        const card = document.createElement("article");
        card.className = `photo-card ${itemId === targetId ? 'highlighted' : ''}`;
        card.id = `post-${itemId}`;

        card.innerHTML = `
          <div class="photo-frame" title="اضغط لتكبير الصورة">
              <span class="year-badge">${badgeText}</span>
              <img src="${item.image}" alt="${item.title}" loading="lazy" decoding="async">
          </div>
          <div class="photo-info">
              <div class="info-header">
                  <div class="title-wrap">
                    <h2 class="photo-title">${item.title}</h2>
                    ${elapsedText ? `<span class="time-ago-sub">${elapsedText}</span>` : ''}
                  </div>
                  <div class="actions">
                      <button class="action-btn share-btn" data-id="${itemId}" title="مشاركة البوست">
                          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                              <circle cx="18" cy="5" r="3"></circle>
                              <circle cx="6" cy="12" r="3"></circle>
                              <circle cx="18" cy="19" r="3"></circle>
                              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                          </svg>
                      </button>
                      <a href="${item.image}" download class="action-btn" title="تنزيل الصورة">
                          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                              <polyline points="7 10 12 15 17 10"></polyline>
                              <line x1="12" y1="15" x2="12" y2="3"></line>
                          </svg>
                      </a>
                  </div>
              </div>
              <p class="photo-desc">${item.desc}</p>
          </div>
        `;

        card.querySelector(".photo-frame").addEventListener("click", () => {
          openLightbox(item.image, item.title, badgeText, elapsedText, item.desc);
        });

        container.appendChild(card);
        observer.observe(card);
      });

      document.querySelectorAll(".share-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          const postId = e.currentTarget.getAttribute("data-id");
          const shareUrl = `${window.location.origin}${window.location.pathname}?id=${postId}`;

          if (navigator.share) {
            navigator.share({
              title: document.title,
              url: shareUrl
            }).catch(() => {});
          } else {
            navigator.clipboard.writeText(shareUrl).then(() => {
              showToast();
            });
          }
        });
      });
    }

    const sortBtn = document.getElementById("sort-toggle-btn");
    if (sortBtn) {
      sortBtn.addEventListener("click", () => {
        sortNewestFirst = !sortNewestFirst;
        document.getElementById("sort-label").textContent = sortNewestFirst
          ? "الترتيب: الأحدث أولاً"
          : "الترتيب: الأقدم أولاً";
        renderGallery();
      });
    }

    try {
      const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`);
      if (!response.ok) throw new Error("تعذر جلب البيانات.");
      
      const result = await response.json();
      const rawGallery = result.record.gallery || [];

      // تحليل تاريخ كل صورة مسبقاً وحفظه داخل العنصر
      galleryData = rawGallery.map(item => ({
        ...item,
        _dateInfo: analyzeDateInput(item.year)
      }));

      if (galleryData.length > 0) {
        document.getElementById("total-memories").textContent = galleryData.length;

        const validInfos = galleryData.map(item => item._dateInfo).filter(Boolean);
        if (validInfos.length > 0) {
          const minYear = Math.min(...validInfos.map(i => i.minYear));
          const maxYear = Math.max(...validInfos.map(i => i.maxYear));

          document.getElementById("time-span").textContent =
            minYear === maxYear ? `${minYear}` : `${minYear} - ${maxYear}`;
        }
        
        document.getElementById("stats-section").style.display = "block";
      }

      renderGallery();

      if (targetId) {
        const targetElement = document.getElementById(`post-${targetId}`);
        if (targetElement) {
          setTimeout(() => {
            targetElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 300);
        }
      }

    } catch (error) {
      console.error(error);
      container.innerHTML = "<p style='text-align:center; color:var(--mist);'>عذراً، تعذر تحميل الأرشيف حالياً.</p>";
    }
  });
</script>
